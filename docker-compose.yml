version: '3.8'

services:
  
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - research_net

  
  ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      
      - API_URL=http://api:8000/api/research
    networks:
      - research_net
    depends_on:
      - api 


networks:
  research_net:
    driver: bridge